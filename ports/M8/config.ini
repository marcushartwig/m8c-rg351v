; m8c config for the Anbernic RG351V on ArkOS.
;
; UNTESTED - validate against docs/test-plan.md before trusting it.
; M8.sh copies this to ~/.local/share/m8c/config.ini only if that file does not
; already exist. Delete the copy there to pick up edits made here.

[graphics]
; No compositor on ArkOS, so m8c fullscreens itself. The RG351V's 640x480 panel
; is exactly 2x the M8's 320x240, so this is pixel-perfect with no filtering.
fullscreen=true
; RK3326 has a Mali G31. If rendering is glitchy, set false to fall back to the
; software renderer - it is only a 320x240 blit, the CPU can manage it.
use_gpu=true
; Lower = more responsive, more CPU. M8.sh overrides this via IDLE_MS.
idle_ms=25
wait_for_device=true
wait_packets=1024

[audio]
; Deliberately false: M8.sh routes audio outside m8c using alsaloop, which is
; what the RG351V community settled on for this hardware. To try m8c's own SDL
; audio capture instead, set this true and comment out the alsaloop call in
; M8.sh - do not run both, they will fight over the capture device.
audio_enabled=false
audio_buffer_size=1024
audio_device_name=Default

[keyboard]
; Ref: https://wiki.libsdl.org/SDL2/SDL_Scancode
key_up=82
key_left=80
key_down=81
key_right=79
key_select=225
key_select_alt=29
key_start=44
key_start_alt=27
key_opt=226
key_opt_alt=4
key_edit=224
key_edit_alt=22
key_delete=76
key_reset=21
key_jazz_inc_octave=85
key_jazz_dec_octave=84
key_jazz_inc_velocity=86
key_jazz_dec_velocity=69
key_toggle_audio=69

[gamepad]
; SDL GameController button constants - NOT raw joystick button indices.
; 0=A 1=B 2=X 3=Y 4=BACK 5=GUIDE 6=START 7=LEFTSTICK 8=RIGHTSTICK
; 9=LEFTSHOULDER 10=RIGHTSHOULDER 11=DPAD_UP 12=DPAD_DOWN 13=DPAD_LEFT 14=DPAD_RIGHT
;
; Because these are GameController constants rather than raw buttons, they are
; device-independent so long as SDL has a mapping for the pad - so wrong buttons
; almost always mean a missing gamecontrollerdb entry, not a wrong value here.
; The numbering is also unchanged in SDL3, so this survives a move to m8c 2.x.
gamepad_up=11
gamepad_left=13
gamepad_down=12
gamepad_right=14
gamepad_select=4
gamepad_start=6
gamepad_opt=0
gamepad_edit=1
; GUIDE is the RG351V's Function button.
gamepad_quit=5
gamepad_reset=7
gamepad_analog_threshold=30000
gamepad_analog_invert=false
gamepad_analog_axis_updown=1
gamepad_analog_axis_leftright=0
gamepad_analog_axis_select=4
gamepad_analog_axis_start=5
gamepad_analog_axis_opt=-1
gamepad_analog_axis_edit=-1
